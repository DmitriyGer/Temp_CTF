services:
  oracle-agent:
    image: oracle-ctf-agent:latest
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGENT_CONFIG_PATH: /app/settings.json
      AGENT_POLICY_PATH: /app/policy.json
      AGENT_TASK_DIR: /app/tasks
      AGENT_TRAJECTORY_DIR: /app/trajectories
      AGENT_FINAL_RESULT: /app/trajectories/final_result.json
      ORACLE_HOST: ${ORACLE_HOST:-host.docker.internal}
      ORACLE_PORT: ${ORACLE_PORT:-58002}
      ORACLE_SERVICE: ${ORACLE_SERVICE:-FREEPDB1}
      ORACLE_USER: ${ORACLE_USER:-system}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Tech12345}
      TASK_NAME: ${TASK_NAME:-}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_OPTIONAL: ${LLM_OPTIONAL:-true}
      LLM_API_TYPE: ${LLM_API_TYPE:-ollama}
      LLM_URL: ${LLM_URL:-http://host.docker.internal:58003}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:7b}
      LLM_SEARCH_STEPS: ${LLM_SEARCH_STEPS:-10}
      LLM_QUERY_ROW_LIMIT: ${LLM_QUERY_ROW_LIMIT:-30}
      LLM_EXPLAIN_ERRORS: ${LLM_EXPLAIN_ERRORS:-true}
      ALLOW_RESOURCE_LIMIT: ${ALLOW_RESOURCE_LIMIT:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./tasks:/app/tasks:ro
      - ./trajectories:/app/trajectories
